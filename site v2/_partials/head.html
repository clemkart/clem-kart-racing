<!-- Partial head : balises communes a toutes les pages. La page ecrit ensuite title, description,
     canonical, og:* et, pour les pages merci, meta robots noindex.
     Image de partage : chaque page ecrit og:image et twitter:image (/photos/og-image.jpg, 1200 x 630,
     ou une photo couleur propre a la page), jamais ici, sinon la page en aurait deux. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070707">
<meta property="og:site_name" content="{{marque.nom}}">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<!-- Polices : une seule feuille, 5 graisses exactement (Bebas Neue 400, Barlow Condensed 600 et 700, Barlow 400, JetBrains Mono 400).
     Auto-hebergement en woff2 prevu, en attente de l accord de Clement pour telecharger les fichiers. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700&family=Barlow&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<script src="/assets/site.js" defer></script>
