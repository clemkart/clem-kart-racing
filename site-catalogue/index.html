<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Accueil du site 2 : page de transition vers l'accueil du site 1 (plan V4, section 6, point 5).
     La vraie redirection est la règle 301 forcée écrite par scripts/build.js --site2 dans _redirects.
     Cette page ne sert que de repli si la règle n'est pas lue : aucune offre, aucun prix.
     L'ancienne page reste dans l'historique git. -->
<title>{{marque.nom}}</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="{{sites.site1}}/">
<meta http-equiv="refresh" content="0; url={{sites.site1}}/">
<meta name="theme-color" content="#070707">
<style>
body{margin:0;background:#070707;color:#F2EDE8;font-family:Barlow,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;line-height:1.6;}
main{max-width:640px;margin:0 auto;padding:64px 16px;}
a{color:#F2EDE8;text-underline-offset:3px;}
a:focus-visible{outline:2px solid #F2EDE8;outline-offset:3px;}
</style>
</head>
<body>
<main>
<p>Si la page ne change pas toute seule&nbsp;: <a href="{{sites.site1}}/">aller sur le site {{marque.nom}}</a>.</p>
</main>
</body>
</html>
