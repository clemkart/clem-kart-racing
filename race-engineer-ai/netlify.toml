[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Valeurs PUBLIQUES présentes en clair dans index.html (URL Supabase + clé anon, protégée par RLS).
  # Sans cette ligne, le secrets scanning Netlify ferait échouer le build.
  # Les vrais secrets (SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY) ne sont jamais dans le front → toujours scannés.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/skill/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # 'unsafe-inline' requis : scripts/styles inline + handlers onclick dans index.html.
    # Bloque quand même tout script externe hors cdn.jsdelivr.net (SDK Supabase).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# CORS géré par les functions elles-mêmes (origine restreinte au site + localhost dev)
